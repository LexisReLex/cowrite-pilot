<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d1a24">
<title>ShareNotes</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ShareNotes">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{--bg:#ece9f1;--card:#fff;--ink:#1d1a24;--muted:#655f72;--line:#ddd8e6;--soft:#f5f3f8;--cur:#1c7ed6;
  --display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;--body:"IBM Plex Sans","Helvetica Neue",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#121017;--card:#1e1a26;--ink:#f0ecf6;--muted:#a59db4;--line:#373143;--soft:#27222f;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);min-height:100vh;
  padding:max(16px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
.app{max-width:520px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:24px;overflow:hidden;display:flex;flex-direction:column;min-height:calc(100vh - 40px)}
.pad{padding:16px}
h1{font-family:var(--display);font-size:28px;margin:0 0 6px}
h2{font-family:var(--display);font-size:20px;margin:0}
.muted{color:var(--muted)} .mono{font-family:var(--mono);font-size:12px;color:var(--muted)}
.lbl{font-family:var(--mono);font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:8px}
input[type=text]{width:100%;font:16px var(--body);padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
input[type=text]:focus{outline:none;border-color:var(--cur)}
button{font:600 15px var(--body);cursor:pointer}
.btn{border:none;border-radius:12px;padding:12px 16px;background:var(--ink);color:var(--card);width:100%}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.stack{display:flex;flex-direction:column;gap:12px}
.pal{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.pal button{border:3px solid transparent;border-radius:14px;padding:8px 4px;background:var(--soft);color:var(--ink);font:500 12px var(--body);display:flex;flex-direction:column;align-items:center;gap:5px}
.pal button span{width:32px;height:32px;border-radius:50%;display:block}
.pal button[aria-pressed=true]{border-color:var(--ink)}
.pal button.taken{opacity:.45}
.claimbox{display:flex;flex-direction:column;gap:8px;padding:12px;border:2px solid var(--line);border-radius:14px}
.claim{background:transparent;color:var(--ink);cursor:pointer}
.claim i{opacity:1}
.top{padding:14px 16px 10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.title{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.acts{display:flex;gap:6px}
.wa{display:flex;align-items:center;gap:5px;background:#25d366;color:#fff;border-radius:10px;padding:5px 10px;font:600 13px var(--body);text-decoration:none}
.title b{font-family:var(--display);font-size:20px}
.who{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:500 13px var(--body);border:2px solid var(--c);border-radius:99px;padding:3px 10px;display:flex;align-items:center;gap:6px}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--c);opacity:.35}
.chip.on i{opacity:1;animation:blink 2s infinite}
@keyframes blink{50%{opacity:.35}}
.memos{padding:10px 16px;background:var(--soft);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.mlist{height:150px;overflow-y:auto;display:flex;flex-direction:column;gap:6px}
.memos .empty{height:100%;display:flex;align-items:center;justify-content:center;text-align:center;border:2px dashed var(--line);border-radius:12px;color:var(--muted);font-size:13px;padding:8px}
.memo{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:8px;align-items:center;background:var(--card);border-radius:12px;padding:6px 8px;border-left:5px solid var(--c);animation:in .35s ease-out}
.play{width:34px;height:34px;border-radius:50%;border:none;background:var(--c);color:#fff;font-size:13px;display:flex;align-items:center;justify-content:center}
.meta{font-size:12px;color:var(--muted)} .meta b{color:var(--ink)}
.star{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:10px;padding:5px 8px;font:500 12px var(--body);white-space:nowrap}
.star[aria-pressed=true]{background:var(--c);border-color:var(--c);color:#fff}
.del{border:none;background:transparent;color:var(--muted);font-size:15px;padding:4px}
.rec{border:none;border-radius:99px;padding:6px 12px;font:600 12px var(--body);color:#fff;background:#e03131;display:flex;align-items:center;gap:6px}
.rec i{width:8px;height:8px;border-radius:50%;background:#fff}
.rec.on i{animation:blink .8s infinite}
.up{border:2px solid var(--line);border-radius:99px;padding:4px 11px;font:600 12px var(--body);color:var(--ink);background:var(--card);cursor:pointer}
.memos.drop{outline:3px dashed var(--cur);outline-offset:-6px}
.tip{display:flex;gap:8px;align-items:center;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-size:13px}
.tip span{flex:1}
.tip button{border:none;border-radius:8px;padding:5px 10px;font:600 12px var(--body)}
#ti{background:var(--cur);color:#fff}
#tx{background:transparent;color:var(--muted)}
.rowlbl{display:grid;grid-template-columns:62px 1fr;gap:8px;align-items:center;font-size:12px;color:var(--muted)}
.sheet{flex:1;padding:12px 16px;display:flex;flex-direction:column;gap:4px;overflow-y:auto}
.ln{padding:5px 6px;border-radius:8px;cursor:text;font-size:17px;line-height:1.45;animation:in .35s ease-out}
.ln:hover{background:var(--soft)}
@keyframes in{from{opacity:.2;transform:translateY(4px)}to{opacity:1;transform:none}}
.w{font-weight:500;transition:color .4s}
.ln input{font-size:16px}
.add{display:flex;gap:6px;margin-top:6px}
.add input{flex:1;min-width:0;border-color:var(--cur)}
.add button{border:none;border-radius:12px;padding:0 14px;background:var(--cur);color:#fff}
.split{border-top:1px solid var(--line);padding:12px 16px 16px;display:flex;flex-direction:column;gap:8px}
.bar{display:flex;height:16px;border-radius:8px;overflow:hidden;background:var(--soft)}
.bar span{height:100%;transition:width .7s cubic-bezier(.2,.8,.2,1)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;font-variant-numeric:tabular-nums}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:50%}
.share{border:2px solid var(--line);background:transparent;color:var(--ink);border-radius:10px;padding:5px 10px;font:500 13px var(--body)}
.toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--card);padding:10px 16px;border-radius:12px;font-size:14px;z-index:9}
.err{color:#e03131;font-size:13px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app"><div class="pad"><span class="mono">ShareNotes laden…</span></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SB_URL="https://unkkwhpfqzbmpbdoazih.supabase.co";
const SB_KEY="sb_publishable_UZNjBI0n8FbU_FVMWwN1Fw_d-dBHCy0";
const sb=supabase.createClient(SB_URL,SB_KEY);
const PAL=[["Oceaan","#1c7ed6"],["Framboos","#d6336c"],["Amber","#f08c00"],["Smaragd","#2f9e44"],["Violet","#7048e8"],["Turkoois","#1098ad"],["Koraal","#f76707"],["Pruim","#ae3ec9"],["Limoen","#74b816"],["Indigo","#4263eb"],["Robijn","#e03131"],["Mosterd","#c99a06"]];
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
function toast(t){const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}
const params=new URLSearchParams(location.search);
let S={sid:params.get("s"),session:null,writers:[],lines:[],memos:[],me:null,online:new Set(),editing:null,channel:null,rec:null,recTimer:null,playing:null,audio:new Audio()};
const fmt=s=>Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
const pub=p=>sb.storage.from("memos").getPublicUrl(p).data.publicUrl;
S.audio.onended=()=>{S.playing=null;renderMemos()};
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();S.installEvt=e;renderTip()});

async function boot(){
  if(!S.sid) return renderStart();
  const {data,error}=await sb.from("sessions").select("*").eq("id",S.sid).maybeSingle();
  if(error||!data) return renderStart("Deze sessie bestaat niet (meer). Start een nieuwe.");
  S.session=data;
  await loadWriters();
  const mine=store.get("splitvel:"+S.sid);
  S.me=S.writers.find(w=>w.id===mine)||null;
  if(!S.me) return renderJoin();
  enterRoom();
}
async function loadWriters(){const {data}=await sb.from("writers").select("*").eq("session_id",S.sid).order("created_at");S.writers=data||[]}
async function loadLines(){const {data}=await sb.from("lines").select("*").eq("session_id",S.sid).order("pos");S.lines=data||[]}
async function loadMemos(){const {data}=await sb.from("memos").select("*").eq("session_id",S.sid).order("created_at");S.memos=data||[]}

function renderStart(msg){
  $("#app").innerHTML=`<div class="pad stack">
    <span class="mono">ShareNotes · pilot</span>
    <h1>Samen schrijven, in kleur</h1>
    <p class="muted" style="margin:0">Start een schrijfsessie en deel de link. Iedereen schrijft in een eigen kleur, onderin zie je wie wat bijdroeg.</p>
    ${msg?`<p class="err">${esc(msg)}</p>`:""}
    <label class="lbl" for="t">Titel van het nummer</label>
    <input type="text" id="t" placeholder="Bijvoorbeeld: Nachtbus" maxlength="60">
    <button class="btn" id="go">Start schrijfsessie</button></div>`;
  $("#go").onclick=async()=>{
    const title=$("#t").value.trim()||"Nieuw nummer";
    const id=Math.random().toString(36).slice(2,8)+Math.random().toString(36).slice(2,6);
    const {error}=await sb.from("sessions").insert({id,title});
    if(error) return toast("Starten lukte niet: "+error.message);
    location.search="?s="+id;
  };
}

function renderJoin(){
  let pick=null;const taken=new Map(S.writers.map(w=>[w.color,w]));
  $("#app").innerHTML=`<div class="pad stack">
    <span class="mono">Je doet mee aan</span><h1>${esc(S.session.title)}</h1>
    ${S.writers.length?`<div class="claimbox"><span class="lbl">Doe je al mee op een ander apparaat? Tik op je naam</span>
    <div class="who">${S.writers.map(w=>`<button class="chip claim" data-id="${w.id}" style="--c:${w.color}"><i></i>${esc(w.name)}</button>`).join("")}</div>
    <div id="cf"></div></div>
    <span class="lbl">Ben je nieuw? Vul je naam in en kies een vrije kleur</span>`:""}
    <label class="lbl" for="n">Jouw naam</label><input type="text" id="n" maxlength="24" placeholder="Bijvoorbeeld: Mari">
    <span class="lbl">Kies je kleur</span>
    <div class="pal">${PAL.map(([n,h])=>{const t=taken.get(h);return `<button data-h="${h}" ${t?`data-owner="${t.id}" class="taken"`:""}><span style="background:${h}"></span>${esc(t?t.name:n)}</button>`}).join("")}</div>
    <p class="err" id="e"></p>
    <button class="btn" id="j">Meedoen als nieuwe schrijver</button></div>`;
  const claim=id=>{const w=S.writers.find(x=>x.id===id);if(!w)return;
    $("#cf").innerHTML=`<p style="margin:4px 0">Ben jij <b style="color:${w.color}">${esc(w.name)}</b>?</p><button class="btn" id="cy" style="background:${w.color}">Ja, ga verder als ${esc(w.name)}</button>`;
    $("#cf").scrollIntoView({behavior:"smooth",block:"center"});
    $("#cy").onclick=()=>{store.set("splitvel:"+S.sid,w.id);S.me=w;enterRoom()}};
  document.querySelectorAll(".claim").forEach(b=>b.onclick=()=>claim(b.dataset.id));
  document.querySelectorAll(".pal button").forEach(b=>b.onclick=()=>{if(b.dataset.owner)return claim(b.dataset.owner);pick=b.dataset.h;document.querySelectorAll(".pal button").forEach(x=>x.setAttribute("aria-pressed",x===b))});
  $("#j").onclick=async()=>{
    const name=$("#n").value.trim();
    if(!name) return $("#e").textContent="Vul je naam in.";
    if(!pick) return $("#e").textContent="Kies een vrije kleur. Een kleur met een naam eronder is al van iemand.";
    const {data,error}=await sb.from("writers").insert({session_id:S.sid,name,color:pick}).select().single();
    if(error){ $("#e").textContent=error.code==="23505"?"Die kleur is net door iemand anders gekozen. Kies een andere.":"Meedoen lukte niet: "+error.message; await loadWriters(); return renderJoin(); }
    store.set("splitvel:"+S.sid,data.id);S.me=data;await loadWriters();enterRoom();
  };
}

async function enterRoom(){
  document.documentElement.style.setProperty("--cur",S.me.color);
  await loadLines();
  await loadMemos();
  renderRoom();
  S.channel=sb.channel("sessie-"+S.sid,{config:{presence:{key:S.me.id}}})
    .on("postgres_changes",{event:"*",schema:"public",table:"lines",filter:"session_id=eq."+S.sid},p=>{
      if(p.eventType==="DELETE"){S.lines=S.lines.filter(l=>l.id!==p.old.id)}
      else{const i=S.lines.findIndex(l=>l.id===p.new.id);if(i>=0)S.lines[i]=p.new;else S.lines.push(p.new);S.lines.sort((a,b)=>a.pos-b.pos)}
      if(!S.editing)renderSheet();renderSplit();
    })
    .on("postgres_changes",{event:"*",schema:"public",table:"memos",filter:"session_id=eq."+S.sid},p=>{
      if(p.eventType==="DELETE"){S.memos=S.memos.filter(m=>m.id!==p.old.id)}
      else{const i=S.memos.findIndex(m=>m.id===p.new.id);if(i>=0)S.memos[i]=p.new;else S.memos.push(p.new)}
      renderMemos();renderSplit();
    })
    .on("postgres_changes",{event:"INSERT",schema:"public",table:"writers",filter:"session_id=eq."+S.sid},p=>{if(!S.writers.find(w=>w.id===p.new.id))S.writers.push(p.new);renderWho();renderSplit()})
    .on("presence",{event:"sync"},()=>{S.online=new Set(Object.keys(S.channel.presenceState()));renderWho()})
    .subscribe(async st=>{if(st==="SUBSCRIBED")await S.channel.track({at:Date.now()})});
}
const W=id=>S.writers.find(w=>w.id===id)||{name:"?",color:"#999"};
function keepAuthors(old,nw,me){const n=old.length,m=nw.length,d=Array.from({length:n+1},()=>new Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)d[i][j]=old[i].w===nw[j]?d[i+1][j+1]+1:Math.max(d[i+1][j],d[i][j+1]);
  const out=[];let i=0,j=0;while(j<m){if(i<n&&old[i].w===nw[j]){out.push(old[i]);i++;j++}else if(i<n&&d[i+1][j]>=d[i][j+1]){i++}else{out.push({w:nw[j],a:me});j++}}return out}

function renderRoom(){
  $("#app").innerHTML=`<div class="top"><div class="title"><b>${esc(S.session.title)}</b><div class="acts"><a class="wa" id="wa" target="_blank" rel="noopener"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.5 8.5 0 0 1-12.6 7.4L3 20.5l1.6-5.2A8.5 8.5 0 1 1 21 11.5z"/></svg>WhatsApp</a><button class="share" id="sh">Deel link</button></div></div><div class="who" id="who"></div><div class="tip" id="tip" hidden></div></div>
  <div class="memos"><div class="lbl"><span>Memo's</span><div class="acts"><label class="up" for="af">+ Bestand</label><input type="file" id="af" accept="audio/*" hidden><button class="rec" id="rec"><i></i>Opnemen</button></div></div><div class="mlist" id="mlist"></div></div>
  <div class="sheet" id="sheet"></div><div class="split" id="split"></div>`;
  $("#sh").onclick=async()=>{const u=location.href;const t="Doe mee aan onze schrijfsessie: "+S.session.title;if(navigator.share){try{await navigator.share({title:t,text:t,url:u});return}catch(e){if(e&&e.name==="AbortError")return}}try{await navigator.clipboard.writeText(u);toast("Link gekopieerd. Plak hem in WhatsApp.")}catch(e){prompt("Kopieer deze link",u)}};
  const waUrl="https://wa.me/?text="+encodeURIComponent("Doe mee aan onze schrijfsessie: "+S.session.title+"\n"+location.href);
  $("#wa").href=waUrl;
  $("#wa").onclick=e=>{if(/Android|iPhone|iPad|iPod/i.test(navigator.userAgent))return;e.preventDefault();
    const w=window.open(waUrl,"splitvel-wa","popup=yes,width=520,height=720,left="+Math.max(0,screen.width-560)+",top=60");
    if(w){toast("WhatsApp opent in een apart venster. Sluit dat na het versturen.")}else{window.open(waUrl,"_blank")}};
  $("#rec").onclick=toggleRec;
  $("#af").onchange=e=>{const f=e.target.files[0];e.target.value="";if(f)addAudioFile(f)};
  const mz=$(".memos");
  mz.addEventListener("dragover",e=>{e.preventDefault();mz.classList.add("drop")});
  mz.addEventListener("dragleave",()=>mz.classList.remove("drop"));
  mz.addEventListener("drop",e=>{e.preventDefault();mz.classList.remove("drop");const f=e.dataTransfer.files[0];if(f)addAudioFile(f)});
  renderWho();renderMemos();renderSheet();renderSplit();renderTip();
}
function renderTip(){
  const el=$("#tip");if(!el)return;
  const standalone=matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
  if(standalone||store.get("sharenotes:tip")==="weg"){el.hidden=true;return}
  const ios=/iPhone|iPad|iPod/i.test(navigator.userAgent);
  el.hidden=false;
  el.innerHTML=`<span>${S.installEvt?"Zet ShareNotes op je beginscherm.":ios?"Zet ShareNotes op je beginscherm: tik op Delen en dan op <b>Zet op beginscherm</b>.":"Zet ShareNotes op je beginscherm via het menu van je browser."}</span>${S.installEvt?'<button id="ti">Installeer</button>':""}<button id="tx" aria-label="Tip sluiten">&#10005;</button>`;
  $("#tx").onclick=()=>{store.set("sharenotes:tip","weg");el.hidden=true};
  if(S.installEvt)$("#ti").onclick=async()=>{S.installEvt.prompt();await S.installEvt.userChoice;S.installEvt=null;renderTip()};
}
function renderMemos(){
  const el=$("#mlist");if(!el)return;
  if(!S.memos.length){el.innerHTML=`<div class="empty">Nog geen memo's. Tik op Opnemen en hum of zing je idee in.</div>`;return}
  el.innerHTML=S.memos.map(m=>{const w=W(m.writer_id);return `<div class="memo" style="--c:${w.color}"><button class="play" data-id="${m.id}" aria-label="Afspelen">${S.playing===m.id?"&#10074;&#10074;":"&#9654;"}</button><div class="meta"><b>${esc(w.name)}</b> &middot; ${fmt(m.seconds)}${m.chosen?" &middot; gekozen melodie":""}</div><button class="star" data-id="${m.id}" aria-pressed="${m.chosen}">&#9733; ${m.chosen?"Gekozen":"Kies"}</button>${m.writer_id===S.me.id?`<button class="del" data-id="${m.id}" aria-label="Verwijder memo">&#10005;</button>`:"<span></span>"}</div>`}).join("");
  const M=id=>S.memos.find(x=>x.id===id);
  el.querySelectorAll(".play").forEach(b=>b.onclick=()=>{const m=M(b.dataset.id);if(!m)return;
    if(S.playing===m.id){S.audio.pause();S.playing=null}else{S.audio.src=pub(m.path);S.audio.play().catch(()=>toast("Afspelen lukte niet"));S.playing=m.id}renderMemos()});
  el.querySelectorAll(".star").forEach(b=>b.onclick=async()=>{const m=M(b.dataset.id);if(!m)return;m.chosen=!m.chosen;renderMemos();renderSplit();
    const {error}=await sb.from("memos").update({chosen:m.chosen}).eq("id",m.id);if(error)toast("Opslaan lukte niet")});
  el.querySelectorAll(".del").forEach(b=>b.onclick=async()=>{const m=M(b.dataset.id);if(!m||!confirm("Deze memo verwijderen?"))return;
    if(S.playing===m.id){S.audio.pause();S.playing=null}S.memos=S.memos.filter(x=>x.id!==m.id);renderMemos();renderSplit();
    await sb.storage.from("memos").remove([m.path]);await sb.from("memos").delete().eq("id",m.id)});
}
async function saveMemo(blob,mime,secs,ext){
  const path=S.sid+"/"+(crypto.randomUUID?crypto.randomUUID():Date.now()+"-"+Math.random().toString(36).slice(2))+"."+ext;
  toast("Memo opslaan…");
  const up=await sb.storage.from("memos").upload(path,blob,{contentType:mime});
  if(up.error)return toast("Opslaan lukte niet: "+up.error.message);
  const {data,error}=await sb.from("memos").insert({session_id:S.sid,writer_id:S.me.id,path,mime,seconds:secs}).select().single();
  if(error)return toast("Opslaan lukte niet: "+error.message);
  if(!S.memos.find(x=>x.id===data.id))S.memos.push(data);renderMemos();toast("Memo opgeslagen")}
async function addAudioFile(f){
  const name=(f.name||"").toLowerCase();const ext=(name.split(".").pop()||"").replace(/[^a-z0-9]/g,"");
  const byExt={mp3:"audio/mpeg",m4a:"audio/mp4",mp4:"audio/mp4",aac:"audio/aac",wav:"audio/wav",aif:"audio/aiff",aiff:"audio/aiff",ogg:"audio/ogg",webm:"audio/webm"};
  const mime=byExt[ext]||(f.type&&f.type.startsWith("audio/")?f.type:"");
  if(!mime)return toast("Dit is geen geluidsbestand. Gebruik bijvoorbeeld mp3, m4a of wav.");
  if(f.size>20*1024*1024)return toast("Bestand is te groot (max 20 MB).");
  let secs=0;try{secs=await new Promise(res=>{const a=new Audio();a.preload="metadata";a.onloadedmetadata=()=>res(isFinite(a.duration)?Math.round(a.duration):0);a.onerror=()=>res(0);a.src=URL.createObjectURL(f)})}catch(e){}
  saveMemo(f,mime,Math.max(1,secs),byExt[ext]?ext:"audio")}
function resetRecBtn(){const b=$("#rec");if(b){b.classList.remove("on");b.lastChild.textContent="Opnemen"}}
async function toggleRec(){
  if(S.rec){S.rec.stop();return}
  if(!navigator.mediaDevices||!window.MediaRecorder)return toast("Opnemen werkt niet in deze browser. Open de link in Safari of Chrome.");
  let stream;try{stream=await navigator.mediaDevices.getUserMedia({audio:true})}catch(e){return toast("Geen toegang tot de microfoon. Sta de microfoon toe en probeer opnieuw.")}
  const type=["audio/webm;codecs=opus","audio/webm","audio/mp4","audio/ogg"].find(t=>MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(t))||"";
  const r=new MediaRecorder(stream,type?{mimeType:type}:undefined);const chunks=[];const t0=Date.now();
  r.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
  r.onstop=async()=>{stream.getTracks().forEach(t=>t.stop());clearInterval(S.recTimer);S.rec=null;resetRecBtn();
    const mime=(r.mimeType||type||"audio/webm").split(";")[0];const secs=Math.max(1,Math.round((Date.now()-t0)/1000));
    const blob=new Blob(chunks,{type:mime});if(blob.size<500)return toast("Opname te kort.");
    const ext=mime.includes("mp4")?"m4a":mime.includes("ogg")?"ogg":"webm";
    saveMemo(blob,mime,secs,ext)};
  r.start();S.rec=r;const b=$("#rec");b.classList.add("on");b.lastChild.textContent="Stop 0:00";
  S.recTimer=setInterval(()=>{const s=Math.round((Date.now()-t0)/1000);const bb=$("#rec");if(bb)bb.lastChild.textContent="Stop "+fmt(s);if(s>=180&&S.rec)S.rec.stop()},500);
}
function renderWho(){const el=$("#who");if(!el)return;el.innerHTML=S.writers.map(w=>`<span class="chip ${S.online.has(w.id)?"on":""}" style="--c:${w.color}" title="${S.online.has(w.id)?"nu verbonden":"niet verbonden"}"><i></i>${esc(w.name)}${w.id===S.me.id?" (jij)":""}</span>`).join("")}
function renderSheet(){
  const el=$("#sheet");if(!el)return;
  const active=document.activeElement&&document.activeElement.id;const draft=$("#nl")?$("#nl").value:"";
  el.innerHTML=`<div class="lbl"><span>Tekst · tik een regel om te bewerken</span></div>`+
   (S.lines.length?"":`<p class="muted" style="margin:6px 0">Nog leeg. Typ hieronder de eerste regel.</p>`)+
   S.lines.map(l=>l.id===S.editing?`<div class="ln"><input type="text" id="ed" value="${esc(l.words.map(x=>x.w).join(" "))}"></div>`:
   `<div class="ln" data-id="${l.id}">${l.words.map(x=>`<span class="w" style="color:${W(x.a).color}">${esc(x.w)}</span>`).join(" ")}</div>`).join("")+
   `<div class="add"><input type="text" id="nl" placeholder="Nieuwe regel als ${esc(S.me.name)}" value="${esc(draft)}"><button id="ad">Voeg toe</button></div>`;
  el.querySelectorAll(".ln[data-id]").forEach(d=>d.onclick=()=>{S.editing=d.dataset.id;renderSheet();const e=$("#ed");e.focus();e.setSelectionRange(e.value.length,e.value.length)});
  const ed=$("#ed");
  if(ed){let done=false;const save=async()=>{if(done)return;done=true;const l=S.lines.find(x=>x.id===S.editing);S.editing=null;if(!l)return renderSheet();
    const nw=ed.value.trim().split(/\s+/).filter(Boolean);
    if(!nw.length){S.lines=S.lines.filter(x=>x.id!==l.id);renderSheet();renderSplit();await sb.from("lines").delete().eq("id",l.id);return}
    const words=keepAuthors(l.words,nw,S.me.id);
    l.words=words;renderSheet();renderSplit();
    const {error}=await sb.from("lines").update({words,updated_at:new Date().toISOString()}).eq("id",l.id);if(error)toast("Opslaan lukte niet");};
    ed.onkeydown=e=>{if(e.key==="Enter")save();if(e.key==="Escape"){done=true;S.editing=null;renderSheet()}};ed.onblur=save}
  const add=async()=>{const v=$("#nl").value.trim();if(!v)return;$("#nl").value="";
    const pos=(S.lines.length?S.lines[S.lines.length-1].pos:0)+1;
    const words=v.split(/\s+/).map(w=>({w,a:S.me.id}));
    const {data,error}=await sb.from("lines").insert({session_id:S.sid,pos,words}).select().single();
    if(error)return toast("Toevoegen lukte niet");
    if(!S.lines.find(l=>l.id===data.id)){S.lines.push(data);S.lines.sort((a,b)=>a.pos-b.pos)}
    renderSheet();renderSplit();$("#nl").focus()};
  $("#ad").onclick=add;$("#nl").onkeydown=e=>{if(e.key==="Enter")add()};
  if(active==="nl")$("#nl").focus();
}
function renderSplit(){
  const el=$("#split");if(!el)return;
  const r=calcSplit(S.writers,S.lines,S.memos);const ws=S.writers;
  const bar=o=>`<div class="bar">${ws.map(w=>`<span style="width:${(o[w.id]||0)*100}%;background:${w.color}"></span>`).join("")}</div>`;
  el.innerHTML=`<div class="lbl"><span>Verdeling</span><span>${r.words} woorden &middot; ${r.mel} melodie${r.mel===1?"":"&euml;n"}</span></div>
   <div class="rowlbl"><span>Tekst</span>${r.words?bar(r.T):'<span class="mono">nog geen tekst</span>'}</div>
   <div class="rowlbl"><span>Melodie</span>${r.mel?bar(r.M):'<span class="mono">nog geen melodie gekozen</span>'}</div>
   <div class="rowlbl"><span><b>Totaal</b></span>${bar(r.Tot)}</div>
   <div class="legend">${ws.map(w=>`<span><i style="background:${w.color}"></i>${esc(w.name)} ${Math.round((r.Tot[w.id]||0)*100)}%</span>`).join("")}</div>
   <span class="mono">Totaal: tekst en gekozen melodie tellen elk voor de helft.</span>`;
}
function calcSplit(ws,lines,memos){
  const T={},M={},Tot={};let words=0;lines.forEach(l=>l.words.forEach(x=>{T[x.a]=(T[x.a]||0)+1;words++}));
  const ch=memos.filter(m=>m.chosen);ch.forEach(m=>{M[m.writer_id]=(M[m.writer_id]||0)+1/ch.length});
  ws.forEach(w=>{T[w.id]=words?(T[w.id]||0)/words:0;M[w.id]=M[w.id]||0;
    Tot[w.id]=words&&ch.length?(T[w.id]+M[w.id])/2:words?T[w.id]:M[w.id]});
  return {T,M,Tot,words,mel:ch.length};
}
boot();
